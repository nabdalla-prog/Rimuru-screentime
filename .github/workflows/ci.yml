name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Logic, version and changelog tests
        run: node --test tests/*.test.js
      - name: Terminal resolver tests
        run: python3 -m unittest discover -s tests
      - name: Manifest has what a listing needs
        run: jq -e '.id and .name and .version and .license and .homepage and .kinds and .entryPoints' manifest.json
