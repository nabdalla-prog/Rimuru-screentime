name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Logic, version and changelog tests
        run: node --test tests/*.test.js
      - name: Terminal resolver tests
        run: python3 -m unittest discover -s tests
      - name: Manifest has what a listing needs
        run: jq -e '.id and .name and .version and .license and .homepage and .kinds and .entryPoints' manifest.json
